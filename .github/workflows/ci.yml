name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # fmt-check, vet, golangci-lint, unit tests with -race, govulncheck;
      # the linters are pinned as tools in go.mod.
      - name: Lint, test, vulnerability check
        run: make check

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Edits nginx:1.27-alpine, loads the results into the runner's daemon,
      # runs containers from them and removes the test tags afterwards.
      - name: Integration tests
        run: make integration

      - name: CLI smoke test
        run: make smoke

  remote:
    name: Remote host over ssh
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Debian with sshd and its own Docker daemon, reached through an
      # ssh:// Docker context; see test/remote/up.sh.
      - name: Remote round trip
        run: make remote REMOTE_DIR="$RUNNER_TEMP/layve-remote"

  release-snapshot:
    name: Release snapshot (all platforms and packages)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Validates .goreleaser.yaml and builds every archive and package the
      # next release would contain; signing and SBOMs run only on tags.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom

      - uses: actions/upload-artifact@v4
        with:
          name: layve-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
          retention-days: 7
